name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'static/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize image name to lowercase
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Stamp version.json with build metadata
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          path = "version.json"
          with open(path, encoding="utf-8") as file:
              info = json.load(file)
          version = info.get("version")
          if not version:
              raise SystemExit("version.json is missing 'version'")
          # Fixed UTC+8 offset avoids a tzdata dependency inside the build step.
          info["build_time"] = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M:%S")
          info["source_sha"] = os.environ["GITHUB_SHA"]
          with open(path, "w", encoding="utf-8") as file:
              json.dump(info, file, ensure_ascii=False, indent=2)
              file.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write(f"version={version}\n")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=IPTV-API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish build summary
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Docker image published to GHCR"
            echo
            echo "Tags:"
            echo '```text'
            echo "$TAGS"
            echo '```'
            echo
            echo "Pull with:"
            echo '```bash'
            echo "$TAGS" | head -n 1 | awk '{print "docker pull " $0}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
